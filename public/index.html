<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects Dashboard</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1a2233; --muted:#5b6577; --line:#e3e8f0;
    --accent:#3457d5; --accent-ink:#fff; --chip:#eef1f8; --shadow:0 1px 3px rgba(20,30,60,.08);
    --done:#1f9d55; --inprogress:#2f6fed; --planned:#b26a00;
  }
  :root[data-theme=dark]{
    --bg:#0f1420; --panel:#1a2130; --ink:#e7ecf5; --muted:#93a0b5; --line:#2a3346;
    --accent:#5b7cf6; --chip:#232c3d; --shadow:0 1px 3px rgba(0,0,0,.4);
    --done:#3ecf7f; --inprogress:#6f9bff; --planned:#e0a340;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0f1420; --panel:#1a2130; --ink:#e7ecf5; --muted:#93a0b5; --line:#2a3346;
    --accent:#5b7cf6; --chip:#232c3d; --shadow:0 1px 3px rgba(0,0,0,.4);
    --done:#3ecf7f; --inprogress:#6f9bff; --planned:#e0a340;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .bar{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  .bar .stamp{color:var(--muted);font-size:12px}
  .grow{flex:1}
  input[type=search]{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;min-width:200px;font-size:14px}
  .btn{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px}
  .btn:hover{border-color:var(--accent)}
  main{max-width:1200px;margin:0 auto;padding:20px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 18px;color:var(--muted);font-size:13px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .zone{margin:0 0 26px}
  .zone h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card h3{margin:0 0 8px;font-size:15px;font-weight:650}
  .meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--ink)}
  .prog{height:7px;background:var(--chip);border-radius:6px;overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  .pct{font-size:12px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);opacity:0;pointer-events:none;transition:.15s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--line);
          transform:translateX(100%);transition:.2s;z-index:11;overflow-y:auto;padding:22px}
  .drawer.on{transform:none}
  .drawer .x{position:absolute;top:14px;right:16px}
  .drawer h2{margin:0 6px 4px 0;font-size:20px;padding-right:30px}
  .sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .desc{color:var(--ink);font-size:14px}
  ul.tasks{list-style:none;padding:0;margin:0}
  ul.tasks li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  ul.tasks li .tp{display:flex;justify-content:space-between;gap:10px;align-items:center}
  ul.tasks li .miniprog{height:5px;background:var(--chip);border-radius:4px;margin-top:6px;overflow:hidden}
  ul.tasks li .miniprog>i{display:block;height:100%;background:var(--accent)}
  details.kb{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 12px}
  details.kb>summary{cursor:pointer;padding:10px 0;font-weight:600}
  details.kb .kbbody{padding:0 0 12px;font-size:14px;overflow-x:auto}
  details.kb .kbbody img{max-width:100%}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;color:#fff}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">Projects Dashboard</h1>
    <span class="stamp" id="stamp"></span>
    <span class="grow"></span>
    <input type="search" id="q" placeholder="Search projects…" autocomplete="off">
    <button class="btn" id="theme" title="Toggle theme">◐</button>
  </div>
</header>
<main>
  <div class="legend" id="legend"></div>
  <div id="board"></div>
  <div class="empty" id="empty" hidden>No projects to show. Run <code>php bin/generate.php</code>.</div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const STCOL = { done:'var(--done)', inprogress:'var(--inprogress)', planned:'var(--planned)' };
const codeColor = s => STCOL[s === 'prod' ? 'done' : s === 'plan' ? 'planned' : 'inprogress'] || 'var(--inprogress)';

let DATA = { projects: [], states: [], generated: '' };
let FILTER = '';

// theme
(function(){
  const saved = localStorage.getItem('pd-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pd-theme', next);
  };
})();

$('#q').addEventListener('input', e => { FILTER = e.target.value.trim().toLowerCase(); renderBoard(); });

function load(){
  fetch('data.json?_=' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { DATA = d; render(); })
    .catch(() => { $('#empty').hidden = false; });
}

function render(){
  $('#stamp').textContent = DATA.generated ? ('Updated ' + DATA.generated) : '';
  renderLegend();
  renderBoard();
}

function renderLegend(){
  const seen = new Set(); const wrap = $('#legend'); wrap.innerHTML = '';
  (DATA.states || []).forEach(s => {
    if (seen.has(s.code)) return; seen.add(s.code);
    wrap.appendChild(el('span', null,
      `<span class="dot" style="background:${codeColor(s.code)}"></span>${esc(s.name)}`));
  });
}

function match(p){
  if (!FILTER) return true;
  return (p.n + ' ' + p.area + ' ' + p.entidad + ' ' + p.responsable + ' ' + (p.d||''))
    .toLowerCase().includes(FILTER);
}

function renderBoard(){
  const board = $('#board'); board.innerHTML = '';
  const list = (DATA.projects || []).filter(match);
  $('#empty').hidden = (DATA.projects || []).length !== 0 && list.length !== 0;
  if (!list.length){ if ((DATA.projects||[]).length) board.innerHTML = '<div class="empty">No matches.</div>'; return; }

  const zones = {};
  list.forEach(p => { (zones[p.area || 'General'] ??= []).push(p); });

  Object.keys(zones).sort().forEach(zname => {
    const z = el('section', 'zone');
    z.appendChild(el('h2', null, esc(zname) + ` <span style="color:var(--muted);font-weight:400">· ${zones[zname].length}</span>`));
    const g = el('div', 'grid');
    zones[zname].forEach(p => g.appendChild(card(p)));
    z.appendChild(g); board.appendChild(z);
  });
}

function card(p){
  const c = el('article', 'card');
  c.appendChild(el('h3', null, esc(p.n)));
  const meta = el('div', 'meta');
  meta.appendChild(el('span', 'chip',
    `<span class="dot" style="background:${p.color || codeColor(p.s)}"></span>${esc(p.estado || '')}`));
  if (p.entidad && p.entidad !== '-') meta.appendChild(el('span', 'chip', esc(p.entidad)));
  if (p.responsable && p.responsable !== '-') meta.appendChild(el('span', 'chip', '👤 ' + esc(p.responsable)));
  if (p.kb && p.kb.length) meta.appendChild(el('span', 'chip', '📄 ' + p.kb.length));
  c.appendChild(meta);
  c.appendChild(el('div', 'prog', `<i style="width:${p.pct|0}%"></i>`));
  const pend = (p.pend || []).length, done = (p.done || []).length;
  c.appendChild(el('div', 'pct', `<span>${p.pct|0}%</span><span>${done}/${done + pend} tasks</span>`));
  c.onclick = () => openDrawer(p);
  return c;
}

function openDrawer(p){
  const d = $('#drawer'); d.innerHTML = '';
  d.appendChild(el('button', 'btn x', '✕')).onclick = closeDrawer;
  d.appendChild(el('h2', null, esc(p.n)));
  const meta = el('div', 'meta');
  meta.appendChild(el('span', 'chip',
    `<span class="dot" style="background:${p.color || codeColor(p.s)}"></span>${esc(p.estado||'')} · ${p.pct|0}%`));
  if (p.entidad && p.entidad !== '-') meta.appendChild(el('span', 'chip', esc(p.entidad)));
  if (p.responsable && p.responsable !== '-') meta.appendChild(el('span', 'chip', '👤 ' + esc(p.responsable)));
  if (p.start || p.end) meta.appendChild(el('span', 'chip', `🗓 ${p.start||'?'} → ${p.end||'?'}`));
  d.appendChild(meta);

  if (p.d) { d.appendChild(el('div', 'sec', 'Description')); d.appendChild(el('div', 'desc', esc(p.d))); }

  if (p.tasks && p.tasks.length){
    d.appendChild(el('div', 'sec', `Tasks (${p.tasks.length})`));
    const ul = el('ul', 'tasks');
    p.tasks.forEach(t => {
      const li = el('li');
      li.appendChild(el('div', 'tp',
        `<span>${esc(t.t)}</span><span class="tag" style="background:${t.color||codeColor(t.s)}">${t.pct|0}%</span>`));
      li.appendChild(el('div', 'miniprog', `<i style="width:${t.pct|0}%;background:${t.color||codeColor(t.s)}"></i>`));
      ul.appendChild(li);
    });
    d.appendChild(ul);
  }

  if (p.kb && p.kb.length){
    d.appendChild(el('div', 'sec', `Knowledge base (${p.kb.length})`));
    p.kb.forEach(k => {
      const det = el('details', 'kb');
      det.appendChild(el('summary', null, esc(k.title)));
      det.appendChild(el('div', 'kbbody', k.html || ''));
      d.appendChild(det);
    });
  }

  $('#scrim').classList.add('on');
  d.classList.add('on'); d.setAttribute('aria-hidden', 'false');
}
function closeDrawer(){
  $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('on');
}
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

load();
</script>
</body>
</html>
